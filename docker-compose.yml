# =============================================================
#  农作物害虫智能检测系统 — Docker Compose 编排
#  用法：docker compose up -d --build
# =============================================================
services:
  pest-detect:
    build:
      context: .
      dockerfile: Dockerfile
    image: pest-detect:latest
    container_name: pest-detect
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 大模型配置（可选）。优先从项目根 .env 读取，也可直接在此覆盖：
      # LLM_API_KEY / LLM_BASE_URL / LLM_MODEL / LLM_WIRE_API
      - TZ=Asia/Shanghai
    env_file:
      - .env            # 若存在则注入 LLM_* 等环境变量（不存在时自动忽略）
    volumes:
      # 模型权重（宿主放 best.pt，279MB 不进镜像）
      - ./backend/models:/app/backend/models
      # 运行时数据（结果图 / 上传临时文件，便于宿主机查看与备份）
      - ./backend/results:/app/backend/results
      - ./backend/uploads:/app/backend/uploads
      # 知识库语义索引（首次会自动构建并持久化到宿主机，避免每次重建）
      - ./knowledge/vector_store:/app/knowledge/vector_store
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── 可选：监控（论文实验 D 稳定性/指标采集） ────────────────
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
